name: backend-ci
on:
  push: { paths: ["backend/**", "analysis_runtime/**", ".github/workflows/backend-ci.yml"] }
  pull_request: { paths: ["backend/**", "analysis_runtime/**"] }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e "backend[dev]"
      - run: ruff check backend/src backend/tests analysis_runtime
      - run: pytest backend/tests analysis_runtime/tests -q
      - run: docker build -t terraforge-api ./backend
      - run: docker build -t terraforge-analysis ./analysis_runtime
